; Phase 9 Sprint 4 (ADR-027 Decision 6) — the PHP-FPM pool had never been
; tuned since Phase 0: this file did not exist, and the image shipped
; Alpine's stock pm.max_children=5. That default was empirically
; discovered to be the actual bottleneck behind a single rejected bid
; request taking 8.6 seconds under only ~7 concurrent HTTP requests
; during Sprint 4's own load-test dry run — a synchronous (PHP-FPM)
; bottleneck, not a Horizon/queue-processing one; documented separately
; from Horizon capacity tuning per that same decision.
;
; Values below are a first evidence-informed pass sized against this
; host's available resources (16 cores, ~15GB RAM at measurement time),
; not a permanent production capacity plan — see
; docs/operations/capacity-tuning-report.md for the load-test evidence
; and docs/operations/synchronous-bottlenecks.md for this specific
; finding. Revisit after real production telemetry exists, the same
; "provisional engineering constant" posture already applied to
; Decision 3's own targets.
[www]
user = www-data
group = www-data
pm = dynamic
pm.max_children = 20
pm.start_servers = 6
pm.min_spare_servers = 4
pm.max_spare_servers = 12
