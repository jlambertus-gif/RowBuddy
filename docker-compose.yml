# Base service definitions. `docker compose` automatically merges
# docker-compose.override.yml on top of this file when present — that file
# carries local-development-only conveniences (bind mounts, exposed DB/Redis
# ports, the Vite dev server). This file alone is meant to stay closer to
# how the stack would run in a real environment.
#
# NOTE: this configuration has not been executed in this environment (no
# Docker installation was available to verify it end-to-end). It has been
# reviewed for correctness but should be smoke-tested before being relied on.

services:
    app:
        build:
            context: .
            dockerfile: infrastructure/docker/php/Dockerfile
        image: rowbuddy/app:local
        env_file:
            - apps/web/.env
        environment:
            DB_HOST: postgres
            REDIS_HOST: redis
            REVERB_HOST: reverb
        depends_on:
            - postgres
            - redis
        networks:
            - rowbuddy

    nginx:
        image: nginx:1.27-alpine
        volumes:
            - ./infrastructure/nginx/app.conf:/etc/nginx/conf.d/default.conf:ro
            - ./apps/web/public:/var/www/apps/web/public:ro
        ports:
            - '8000:80'
        depends_on:
            - app
        networks:
            - rowbuddy

    postgres:
        # PostGIS-enabled image (ADR-007): no official Alpine PostGIS
        # image exists, hence Debian-based here unlike the other
        # Alpine-based services in this file. Same PostgreSQL major
        # version (16) as before the switch.
        image: postgis/postgis:16-3.4
        environment:
            POSTGRES_DB: rowbuddy
            POSTGRES_USER: rowbuddy
            POSTGRES_PASSWORD: rowbuddy
        volumes:
            - postgres-data:/var/lib/postgresql/data
        networks:
            - rowbuddy

    redis:
        image: redis:7-alpine
        volumes:
            - redis-data:/data
        networks:
            - rowbuddy

    horizon:
        image: rowbuddy/app:local
        command: php artisan horizon
        env_file:
            - apps/web/.env
        environment:
            DB_HOST: postgres
            REDIS_HOST: redis
            REVERB_HOST: reverb
        depends_on:
            - app
            - postgres
            - redis
        networks:
            - rowbuddy

    reverb:
        image: rowbuddy/app:local
        command: php artisan reverb:start --host=0.0.0.0 --port=8080
        env_file:
            - apps/web/.env
        environment:
            DB_HOST: postgres
            REDIS_HOST: redis
        ports:
            - '8080:8080'
        depends_on:
            - app
            - postgres
            - redis
        networks:
            - rowbuddy

volumes:
    postgres-data:
    redis-data:

networks:
    rowbuddy:
        driver: bridge
